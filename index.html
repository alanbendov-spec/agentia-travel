:root{
  --ink:#0b0b0b; --onyx:#141414; --graphite:#232326; --slate:#303036;
  --gold:#d4af37; --gold-deep:#b9944a; --gold-soft:#d4af371f;
  --ivory:#f5f1e6; --mist:#b7b0a1;
  --fd:'Poppins',system-ui,sans-serif; --fb:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--ivory);font-family:var(--fb);-webkit-font-smoothing:antialiased;line-height:1.6}
h1,h2,h3{font-family:var(--fd);letter-spacing:-.015em;margin:0;text-wrap:balance;line-height:1.12}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.sym{width:36px;height:36px}
.kicker{font-size:12.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:0 0 12px}
.section{padding:88px 0}
.section h2{font-size:clamp(26px,4vw,42px);font-weight:700}
.lead{color:var(--mist);font-size:18px;max-width:60ch;margin:14px 0 0}
.tinted{background:var(--onyx)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:12px 26px;border-radius:999px;font-weight:600;font-size:15px;cursor:pointer;border:none;transition:.2s;font-family:var(--fb)}
.btn-gold{background:var(--gold);color:var(--ink)} .btn-gold:hover{background:var(--gold-deep)}
.btn-ghost{background:transparent;color:var(--ivory);border:1px solid rgba(245,241,230,.4)} .btn-ghost:hover{border-color:var(--ivory);background:rgba(245,241,230,.06)}
.card{background:var(--onyx);border:1px solid var(--graphite);border-radius:18px}

/* header */
header{position:fixed;inset:0 0 auto;z-index:50;transition:.3s;border-bottom:1px solid transparent}
header.solid{background:rgba(11,11,11,.95);backdrop-filter:blur(10px);border-bottom-color:var(--graphite)}
.hrow{display:flex;align-items:center;justify-content:space-between;height:74px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:600;font-size:22px}
.brand .dot{color:var(--gold)}
nav.desk{display:none;gap:6px}
@media(min-width:940px){nav.desk{display:flex}}
nav.desk a{padding:8px 14px;border-radius:999px;font-size:14px;color:rgba(245,241,230,.85)}
nav.desk a:hover{background:rgba(245,241,230,.1);color:var(--ivory)}
.hact{display:flex;align-items:center;gap:12px}
.lang{display:flex;gap:2px;border:1px solid rgba(245,241,230,.2);border-radius:999px;padding:3px}
.lang button{min-height:32px;padding:4px 12px;border-radius:999px;background:transparent;color:rgba(245,241,230,.8);border:none;font-weight:700;font-size:13px;cursor:pointer;font-family:var(--fb)}
.lang button.on{background:var(--ivory);color:var(--ink)}
.hact .btn{min-height:40px;padding:8px 18px;font-size:14px}

/* hero */
.hero{position:relative;min-height:94vh;display:flex;align-items:flex-end;overflow:hidden}
.hero .bg{position:absolute;inset:0}
.hero .bg img{width:100%;height:100%;object-fit:cover}
.hero .veil{position:absolute;inset:0;background:linear-gradient(to top,var(--ink) 4%,rgba(11,11,11,.35) 45%,rgba(11,11,11,.2))}
.hero .inner{position:relative;padding:0 0 96px}
.hero h1{font-size:clamp(38px,7vw,74px);font-weight:700;max-width:16ch}
.hero .lead{font-size:clamp(17px,2.2vw,21px);max-width:44ch;color:rgba(245,241,230,.92)}
.hero .cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:32px}

/* trust seals */
.seals{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 40px;padding:34px 0}
.seal{display:flex;align-items:center;gap:14px}
.seal-medal{width:60px;height:60px;flex:none}
.seal-logochip{width:auto;max-width:120px;height:44px;display:flex;align-items:center;justify-content:flex-start}
.seal-logochip img{width:auto;height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 0 1px rgba(245,241,230,.25))}
.seal b{display:block;font-size:15px;color:var(--ivory)}
.seal span{display:block;font-size:12.5px;color:var(--mist)}
.trust-t{text-align:center;font-size:12.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mist);padding-top:26px}

/* anthropic band */
.anth{position:relative;overflow:hidden;border-top:1px solid var(--graphite);border-bottom:1px solid var(--graphite);background:radial-gradient(120% 140% at 80% 0%,rgba(212,175,55,.12),transparent 55%)}
.anth .inner{padding:80px 0;display:grid;gap:32px;align-items:center}
@media(min-width:860px){.anth .inner{grid-template-columns:1.3fr 1fr}}
.anth h2{font-size:clamp(26px,4vw,40px)}
.anth .glow{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:36px;border:1px solid var(--gold-soft);border-radius:24px;background:linear-gradient(160deg,rgba(212,175,55,.08),rgba(20,20,20,.4))}
.anth-badge{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border:1px solid var(--gold);border-radius:999px;font-weight:600;color:var(--gold);letter-spacing:.02em}
.anth-star{width:40px;height:40px}
.anth-mark{font-family:var(--fd);font-weight:700;font-size:26px;color:var(--ivory);display:flex;align-items:center;gap:12px}

/* planner */
.planner{display:grid;overflow:hidden}
@media(min-width:920px){.planner{grid-template-columns:1fr 1fr}}
.chatcol{display:flex;flex-direction:column;height:560px;border-bottom:1px solid var(--graphite)}
@media(min-width:920px){.chatcol{height:640px;border-bottom:none;border-right:1px solid var(--graphite)}}
.chathead{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--graphite)}
.chathead .who b{display:block;font-size:14px;font-weight:700}
.chathead .who span{font-size:12px;color:var(--mist)}
.livedot{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.livedot i{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.msgs{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:86%;padding:11px 15px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-line;animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.bot{background:var(--ink);border:1px solid var(--graphite);border-top-left-radius:4px;color:rgba(245,241,230,.92)}
.msg.user{align-self:flex-end;background:var(--gold);color:var(--ink);border-top-right-radius:4px;font-weight:500}
.typing{display:inline-flex;gap:5px;padding:12px 16px;background:var(--ink);border:1px solid var(--graphite);border-radius:16px;width:max-content}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px 20px 10px;min-height:26px}
.chip{border:1px solid rgba(212,175,55,.5);background:var(--gold-soft);color:var(--ivory);border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;font-family:var(--fb)}
.chip:hover{background:var(--gold);color:var(--ink)}
.chip.ghost{border-color:var(--graphite);background:transparent;color:var(--mist)}
.chips .note{font-size:12.5px;color:var(--mist);align-self:center}
.chatinput{display:flex;gap:10px;align-items:center;padding:6px 16px 16px;border-top:1px solid var(--graphite);margin-top:auto}
.chatinput input{flex:1;min-height:44px;background:var(--ink);border:1px solid var(--graphite);border-radius:999px;padding:0 18px;color:var(--ivory);font-size:14px;font-family:var(--fb)}
.chatinput input::placeholder{color:var(--mist)}
.chatinput input:focus{outline:none;border-color:var(--gold)}
.chatinput input:disabled{opacity:.45;cursor:not-allowed}
.chatinput .sendbtn{width:44px;height:44px;flex:none;border-radius:50%;background:var(--gold);border:none;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.chatinput .sendbtn:hover{background:var(--gold-deep)}
.chatinput .sendbtn:disabled{opacity:.4;cursor:not-allowed;background:var(--gold)}
.chatinput .sendbtn svg{width:18px;height:18px}
.itincol{display:flex;flex-direction:column;height:560px;background:var(--ink)}
@media(min-width:920px){.itincol{height:640px}}
.itinhead{padding:14px 20px;border-bottom:1px solid var(--graphite)}
.itinhead .k{font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.itinhead .d{font-family:var(--fd);font-weight:600;font-size:17px;margin-top:3px}
.itinhead .d small{font-family:var(--fb);font-weight:400;color:var(--mist);font-size:13px}
.itinbody{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.iitem{display:flex;gap:12px;padding:13px;border:1px solid var(--graphite);border-radius:14px;background:var(--onyx);animation:rise .4s ease}
.iitem .ic{font-size:18px;line-height:1.2}
.iitem .body{flex:1;min-width:0}
.iitem .body b{font-size:14px;font-weight:600}
.iitem .body .m{font-size:12px;color:var(--mist);margin-top:2px}
.iitem .body .pr{font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--gold-deep);margin-top:4px}
.iitem .px{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.iitem .px .old{font-size:12px;color:var(--mist);text-decoration:line-through}
.iitem .px .new{font-size:14px;font-weight:700;color:var(--gold)}
.itinempty{flex:1;display:flex;align-items:center;justify-content:center;opacity:.14}
.itinempty svg{width:120px;height:120px}
.totals{padding:16px 20px;border-top:1px solid var(--graphite);font-variant-numeric:tabular-nums}
.totals .row{display:flex;justify-content:space-between;gap:16px;align-items:baseline}
.totals .pub{color:var(--mist);font-size:14px}.totals .pub s{color:var(--mist)}
.totals .ag b{font-size:15px}.totals .ag .v{font-family:var(--fd);font-size:26px;font-weight:700;color:var(--gold)}
.totals .save{text-align:right;font-size:12.5px;font-weight:700;color:var(--gold-deep);margin-top:6px}
.totals .note{font-size:11px;color:rgba(183,176,161,.8);margin-top:8px}
.actbox{padding:16px 20px;border-top:1px solid var(--graphite)}
.actbox .in{border:1px solid rgba(212,175,55,.5);background:var(--gold-soft);border-radius:14px;padding:16px}
.actbox .in b{display:flex;align-items:center;gap:8px;font-weight:700}
.actbox .in p{font-size:13.5px;color:var(--mist);margin:6px 0 0;line-height:1.5}
.actbox .in .btn{margin-top:12px;min-height:40px;padding:8px 18px;font-size:14px}

/* gallery */
.ggrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:36px}
@media(min-width:760px){.ggrid{grid-template-columns:repeat(5,1fr)}}
.gtile{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;border:1px solid var(--graphite)}
@media(min-width:760px){.gtile:first-child{grid-row:span 1}}
.gtile img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.gtile:hover img{transform:scale(1.05)}
.gtile .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(11,11,11,.85),transparent 60%)}
.gtile .lb{position:absolute;left:12px;bottom:10px;right:12px;font-size:12.5px;font-weight:700;color:var(--ivory)}
.gnote{margin-top:16px;font-size:12px;color:var(--mist)}

/* journey */
.jgrid{display:grid;gap:16px;margin-top:36px}
@media(min-width:760px){.jgrid{grid-template-columns:repeat(3,1fr)}}
.jcard{overflow:hidden}
.jcard .ph{position:relative;aspect-ratio:3/2}
.jcard .ph img{width:100%;height:100%;object-fit:cover}
.jcard .ph .ov{position:absolute;inset:0;background:linear-gradient(to top,var(--onyx),transparent 55%)}
.jcard .ph .lb{position:absolute;left:20px;bottom:12px;font-family:var(--fd);font-weight:700;font-size:24px}
.jcard .tx{padding:22px}
.jcard .tx .s{font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.jcard .tx p{color:var(--mist);font-size:14px;margin:8px 0 0}

/* membership */
.mgrid{display:grid;gap:16px;max-width:840px;margin:36px auto 0}
@media(min-width:720px){.mgrid{grid-template-columns:1fr 1fr}}
.mcard{position:relative;padding:30px;display:flex;flex-direction:column}
.mcard.hl{border-color:rgba(212,175,55,.6)}
.mtag{position:absolute;top:-13px;left:26px;background:var(--gold);color:var(--ink);font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px}
.mcard h3{font-family:var(--fd);font-weight:700;font-size:24px;text-transform:lowercase}
.mprice{margin-top:16px}.mprice .v{font-family:var(--fd);font-weight:700;font-size:40px;color:var(--gold)}
.mprice .b{font-size:14px;color:var(--mist);margin-left:8px}
.mfeat{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:10px;flex:1}
.mfeat li{display:flex;gap:10px;font-size:14px;color:rgba(245,241,230,.88)}
.mfeat li::before{content:"✓";color:var(--gold);font-weight:700}
.mcard .btn{margin-top:24px;width:100%;justify-content:center}

/* final + footer */
.final{text-align:center;border-top:1px solid var(--graphite);position:relative;overflow:hidden}.final .fbg{position:absolute;inset:0}.final .fbg img{width:100%;height:100%;object-fit:cover;opacity:.30}.final .fbg:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--ink) 12%,rgba(11,11,11,.55))}.final>.wrap{position:relative}
.final .cta{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:28px}
footer{border-top:1px solid var(--graphite);background:var(--onyx)}
footer .cols{display:grid;gap:28px;padding:56px 0}
@media(min-width:720px){footer .cols{grid-template-columns:2fr 1fr}}
footer .disc{color:var(--mist);font-size:14px;max-width:44ch;margin-top:16px}
footer .bar{border-top:1px solid var(--graphite);padding:22px 0;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;font-size:12px;color:rgba(183,176,161,.85)}
footer .bar .an{color:var(--gold-deep);font-weight:600}
.demo-note{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--gold);color:var(--ink);text-align:center;font-size:13px;font-weight:600;padding:9px 16px}
.demo-note button{margin-left:12px;background:var(--ink);color:var(--gold);border:none;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

let LANG="en";
const ICONS={flight:"✈️",hotel:"🏨",transfer:"🚄",experience:"✨"};
const fmt=n=>"USD "+n.toLocaleString("en-US");

function applyLang(){
 const d=I18N[LANG];
 document.documentElement.lang=LANG;
 document.querySelectorAll("[data-i]").forEach(el=>{el.textContent=d[el.dataset.i]??"";});
 document.querySelectorAll("[data-i-tpl]").forEach(el=>{
   const tpl=d[el.dataset.iTpl]||"";const arg=el.dataset.arg?d[el.dataset.arg]:"";
   el.textContent=tpl.replace("{p}",arg);
 });
 document.querySelectorAll("[data-flist]").forEach(ul=>{
   ul.innerHTML="";(d[ul.dataset.flist]||[]).forEach(f=>{const li=document.createElement("li");li.textContent=f;ul.appendChild(li);});
 });
 document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.lang===LANG));
 buildPlanner(); // reset planner in the chosen language
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{LANG=b.dataset.lang;applyLang();}));

// header solidify
const hdr=document.getElementById("hdr");
addEventListener("scroll",()=>hdr.classList.toggle("solid",scrollY>24),{passive:true});

// ── PLANNER ─────────────────────────────────────────────
let timers=[];
function clearTimers(){timers.forEach(clearTimeout);timers=[];}
const rm=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
const D=ms=>rm?40:ms;
const SEND_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
/* Keyword → demo-trip matcher, so free-typed destinations still resolve
   to one of the 3 illustrative itineraries (this is a scripted demo —
   the production concierge uses a real model over live inventory). */
const DEST_KEYWORDS=[
  {i:0, words:["japan","japon","japón","tokyo","tokio","kyoto","kioto"]},
  {i:1, words:["greece","grecia","athens","atenas","santorini"]},
  {i:2, words:["new york","nueva york","nyc","ny,","ny "]},
];
function matchTrip(text){
  const low=" "+text.toLowerCase()+" ";
  for(const k of DEST_KEYWORDS){ if(k.words.some(w=>low.includes(w))) return k.i; }
  return 0;
}

function buildPlanner(){
 clearTimers();
 const d=I18N[LANG];const trips=TRIPS[LANG];
 const root=document.getElementById("planner");
 root.innerHTML=`
  <div class="chatcol">
   <div class="chathead">${symSmall()}<div class="who"><b>AGENTIA</b><span>${d.chat_sub}</span></div>
     <span class="livedot"><i></i>${d.demo_badge}</span></div>
   <div class="msgs" id="msgs" aria-live="polite"></div>
   <div class="chips" id="chips"></div>
   <form class="chatinput" id="chatform" autocomplete="off">
    <input type="text" id="chatin" placeholder="${d.type_placeholder}" aria-label="${d.type_placeholder}">
    <button type="submit" class="sendbtn" aria-label="${d.send}">${SEND_ICON}</button>
   </form>
  </div>
  <div class="itincol">
   <div class="itinhead"><div class="k">${d.itin_title}</div><div class="d" id="ihd"><small>${d.itin_empty}</small></div></div>
   <div class="itinbody" id="ibody"><div class="itinempty">${symBig()}</div></div>
   <div id="itot"></div>
  </div>`;
 const st={trip:null,shown:0,phase:"dest"};
 const msgs=root.querySelector("#msgs"),chips=root.querySelector("#chips");
 const form=root.querySelector("#chatform"),input=root.querySelector("#chatin"),sendBtn=form.querySelector(".sendbtn");
 function bot(t,cb){const w=document.createElement("div");w.className="typing";w.innerHTML="<i></i><i></i><i></i>";msgs.appendChild(w);scroll();
   timers.push(setTimeout(()=>{w.remove();const m=document.createElement("div");m.className="msg bot";m.textContent=t;msgs.appendChild(m);scroll();cb&&cb();},D(700)));}
 function user(t){const m=document.createElement("div");m.className="msg user";m.textContent=t;msgs.appendChild(m);scroll();}
 function scroll(){msgs.scrollTop=msgs.scrollHeight;}
 function setChips(html){chips.innerHTML=html;}
 function note(t){setChips('<span class="note">'+t+'</span>');}
 function setInputEnabled(on){input.disabled=!on;sendBtn.disabled=!on;if(on)input.focus();}

 form.onsubmit=(e)=>{
   e.preventDefault();
   const text=input.value.trim();
   if(!text||input.disabled) return;
   input.value="";
   handleTyped(text);
 };

 function handleTyped(text){
   if(st.phase==="dest") pickDest(text, trips[matchTrip(text)]);
   else if(st.phase==="dates") pickDates(text);
   else if(st.phase==="travelers") pickTrav(text);
   else if(st.phase==="vibe") pickVibe(text);
   else if(st.phase==="summary") confirm_();
 }

 function updateHead(){root.querySelector("#ihd").innerHTML=st.trip.dest+' <small>'+st.trip.dates+' · '+st.trip.travelers+'</small>';}

 timers.push(setTimeout(()=>bot(d.greeting,()=>{
   setChips(trips.map((t,i)=>'<button class="chip" data-i="'+i+'">'+t.chip+'</button>').join(""));
   chips.querySelectorAll(".chip").forEach(c=>c.onclick=()=>pickDest(trips[+c.dataset.i].chip, trips[+c.dataset.i]));
   setInputEnabled(true);
 }),D(400)));

 function pickDest(label, template){
   st.trip=Object.assign({},template,{dest:label});
   st.phase="dates";
   user(label); updateHead(); note(d.chip_working);
   bot(d.ask_dates.replace("{d}",st.trip.dest),()=>{
     setChips('<button class="chip">'+st.trip.dates+'</button>');
     chips.querySelector(".chip").onclick=()=>pickDates(st.trip.dates);
     setInputEnabled(true);
   });}
 function pickDates(text){
   st.trip.dates=text; st.phase="travelers";
   user(text); updateHead(); note(d.chip_working);
   bot(d.ask_travelers,()=>{
     setChips('<button class="chip">'+st.trip.travelers+'</button>');
     chips.querySelector(".chip").onclick=()=>pickTrav(st.trip.travelers);
     setInputEnabled(true);
   });}
 function pickTrav(text){
   st.trip.travelers=text; st.phase="vibe";
   user(text); updateHead(); note(d.chip_working);
   bot(d.ask_vibe,()=>{
     setChips('<button class="chip">'+st.trip.vibe+'</button>');
     chips.querySelector(".chip").onclick=()=>pickVibe(st.trip.vibe);
     setInputEnabled(true);
   });}
 function pickVibe(text){
   st.trip.vibe=text; st.phase="building";
   user(text); note(d.chip_working);
   setInputEnabled(false);
   bot(d.searching,()=>{build();});}

 function build(){const body=root.querySelector("#ibody");body.innerHTML="";
   st.trip.items.forEach((it,i)=>{
     timers.push(setTimeout(()=>{
       st.shown=i+1;
       const el=document.createElement("div");el.className="iitem";
       el.innerHTML='<div class="ic">'+ICONS[it.k]+'</div><div class="body"><b>'+it.t+'</b><div class="m">'+it.m+'</div><div class="pr">'+it.pr+'</div></div><div class="px">'+(it.pub>it.ag?'<div class="old">'+fmt(it.pub)+'</div>':'')+'<div class="new">'+fmt(it.ag)+'</div></div>';
       body.appendChild(el);body.scrollTop=body.scrollHeight;
       renderTot();
       const found=d["found_"+it.k]||"{t} ✓";
       const m=document.createElement("div");m.className="msg bot";m.textContent=found.replace("{t}",it.t);msgs.appendChild(m);scroll();
     },D(1000+i*1000)));
   });
   timers.push(setTimeout(()=>{
     const a=total(),p=pub();
     st.phase="summary";
     bot(d.summary.replace("{a}",fmt(a)).replace("{p}",fmt(p)).replace("{s}",fmt(p-a)),()=>{
       setChips('<button class="chip">'+d.chip_confirm+'</button><span class="note">'+d.type_confirm_hint+'</span>');
       chips.querySelector(".chip").onclick=confirm_;
       setInputEnabled(true);
     });
   },D(1000+st.trip.items.length*1000+400)));
 }
 function total(){return st.trip.items.slice(0,st.shown).reduce((s,x)=>s+x.ag,0);}
 function pub(){return st.trip.items.slice(0,st.shown).reduce((s,x)=>s+x.pub,0);}
 function renderTot(){const a=total(),p=pub();
   root.querySelector("#itot").innerHTML='<div class="totals"><div class="row pub"><span>'+d.tot_public+'</span><s>'+fmt(p)+'</s></div><div class="row ag"><b>'+d.tot_agentia+'</b><span class="v">'+fmt(a)+'</span></div>'+(p>a?'<div class="save">'+d.tot_save.replace("{a}",fmt(p-a))+'</div>':'')+'<div class="note">'+d.tot_note+'</div></div>';}
 function confirm_(){
   st.phase="done";
   user(d.chip_confirm);
   setInputEnabled(false);
   bot(d.confirmed,()=>{
